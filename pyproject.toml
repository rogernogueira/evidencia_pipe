[project]
name = "evidencia_pipe"
version = "0.1.0"
description = "Fork independente do pipeline de ingestão DSpace do minerU (item-UUID → MinerU → Qdrant → LLM)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.2",
    "uvicorn>=0.42.0",
    "python-multipart>=0.0.22",
    "mineru[all]~=3.4.4",
    "pypdf>=6.9.2",
    "psutil>=7.2.2",
    "qdrant-client[fastembed]>=1.14.0",
    "fastembed-gpu>=0.7.3",
    "onnxruntime-gpu>=1.24.4",
    "fastembed>=0.7.3",
    "unidecode>=1.4.0",
    "openai>=1.0.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.10",
    # Embedding (estágio 3): o bge-m3 roda nos contêineres vLLM; aqui só precisamos
    # do cliente HTTP (httpx) e do tokenizer (transformers) — o tokenizer alinha os
    # lexical_weights token a token e também alimenta o chunking por tokens.
    "httpx>=0.27",
    "transformers>=4.40",
    # markdownify: chunks.py converte tabelas HTML → Markdown
    "markdownify>=0.14.1",
    "celery[redis]>=5.4",
    "flower>=2.0.1",
    # Coordenação da GPU compartilhada (mutex distribuído + fila/prioridade/aging).
    # Biblioteca independente, membro do workspace uv (packages/gpu_resource_manager).
    "gpu-resource-manager",
    "minio>=7.2.20",
]

# --- Workspace uv --------------------------------------------------------------
# packages/gpu_resource_manager é uma biblioteca independente (empacotável como
# wheel e instalável em outros repositórios), desenvolvida aqui como membro do
# workspace. `uv sync` a instala em modo editável automaticamente.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
gpu-resource-manager = { workspace = true }

[dependency-groups]
# Ferramentas de teste (não vão para produção). `uv sync --group test`.
test = ["pytest>=8.0", "fakeredis[lua]>=2.21"]
