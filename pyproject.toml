[project]
name = "evidencia_pipe"
version = "0.1.0"
description = "Fork independente do pipeline de ingestão DSpace do minerU (item-UUID → MinerU → Qdrant → LLM)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.2",
    "uvicorn>=0.42.0",
    "python-multipart>=0.0.22",
    "mineru[all]==3.2.0",
    "pypdf>=6.9.2",
    "psutil>=7.2.2",
    "qdrant-client[fastembed]>=1.14.0",
    "fastembed-gpu>=0.7.3",
    "onnxruntime-gpu>=1.24.4",
    "fastembed>=0.7.3",
    "unidecode>=1.4.0",
    "openai>=1.0.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.10",
    # Requeridos pelos serviços copiados verbatim do minerU (estágio 3):
    #   - flagembedding: embedder.py usa FlagEmbedding.BGEM3FlagModel (dense+sparse)
    #   - markdownify:  chunks.py converte tabelas HTML → Markdown
    "flagembedding>=1.3.5",
    "markdownify>=0.14.1",
    "celery[redis]>=5.4",
    "flower>=2.0.1",
]
