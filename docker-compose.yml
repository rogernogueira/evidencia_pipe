# Infra de orquestração do evidencia_pipe: Redis (broker do Celery + job_store +
# gpu_resource_manager) e Flower (monitor). MinerU, Qdrant e os workers Celery
# rodam fora deste compose (no venv do host, por causa da GPU e dos modelos
# locais) — veja CELERY.md.
#
# Um único Redis serve três DBs lógicos: DB 0 = broker Celery, DB 1 = job_store,
# DB 2 = gpu_resource_manager (coordenação da GPU). MinerU, BGE-M3 e scripts
# externos apontam todos para o MESMO Redis DB 2 (GPU_MANAGER_REDIS_URL) e o
# MESMO GPU_RESOURCE_NAME para se coordenarem.
services:
  redis:
    image: redis:7-alpine
    container_name: evidencia_redis
    command: ["redis-server", "--appendonly", "yes"]
    # Exposto na loopback do host porque os workers de GPU e o MinerU rodam no
    # host (não em contêiner). Restrito a 127.0.0.1 para não abrir na rede.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  flower:
    image: mher/flower:2.0
    container_name: evidencia_flower
    command: ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555"]
    environment:
      # Libera a API REST (/api/*) sem autenticação. A UI web funciona sem isto.
      FLOWER_UNAUTHENTICATED_API: "true"
    ports:
      - "5555:5555"        # UI em http://localhost:5555
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Armazenamento OFICIAL dos artefatos do pipeline (S3-compatível). Versão FIXADA
  # (nunca :latest). Bucket privado — sem acesso anônimo. A porta 9001 (console) só
  # deve ser exposta para administração; não a exponha em produção sem necessidade.
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: evidencia_minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"        # API S3
      - "9001:9001"        # Console (uso administrativo)
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Inicialização idempotente do bucket: cria o bucket, mantém privado e habilita
  # versionamento quando configurado. Roda uma vez e sai.
  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    container_name: evidencia_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-evidencia-pipe}
      MINIO_BUCKET_VERSIONING: ${MINIO_BUCKET_VERSIONING:-true}
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
      mc mb --ignore-existing local/\"$$MINIO_BUCKET\";
      mc anonymous set none local/\"$$MINIO_BUCKET\";
      if [ \"$$MINIO_BUCKET_VERSIONING\" = \"true\" ]; then mc version enable local/\"$$MINIO_BUCKET\"; fi;
      echo 'bucket pronto (privado, versionamento='$$MINIO_BUCKET_VERSIONING')';
      "
    restart: "no"

  # Serviço de extração MinerU (estágio 2). Imagem construída de tmp/Dockerfile
  # (base vllm/vllm-openai, mineru[core]>=3.4.0). REQUER GPU com acesso a TODAS as
  # devices (--gpus all): com device único o vLLM falha com "Device string must not
  # be empty". A porta 8011 evita conflito com serviços MinerU legados na 8010.
  # Os workers no HOST apontam MINERU_API_URL=http://127.0.0.1:8011.
  mineru:
    profiles: ["gpu"]
    build:
      context: ./tmp
    image: evidencia_mineru:local
    container_name: evidencia_mineru
    command: ["mineru-api", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      MINERU_MODEL_SOURCE: local
    ports:
      - "8011:8010"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8010/docs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: unless-stopped

  # Variante SÓ-PIPELINE do MinerU: --enable-vlm-preload false → NÃO carrega o VLM
  # (vLLM) no startup; só os modelos clássicos (DocAnalysis) sob demanda, com
  # footprint de VRAM muito menor. Use para extração rápida liberando VRAM para o
  # bge-m3 rodar em paralelo. Aponte MINERU_API_URL=http://127.0.0.1:8012 e
  # MINERU_BACKEND=pipeline. Normalmente roda-se ESTE **ou** o "mineru" (VLM) — os
  # dois juntos podem estourar a VRAM numa GPU única.
  mineru-pipeline:
    profiles: ["gpu"]
    build:
      context: ./tmp
    image: evidencia_mineru:local
    container_name: evidencia_mineru_pipeline
    command: ["mineru-api", "--host", "0.0.0.0", "--port", "8010", "--enable-vlm-preload", "false"]
    environment:
      MINERU_MODEL_SOURCE: local
    ports:
      - "8012:8010"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8010/docs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # MinerU 4.0.0a5 (PRÉ-LANÇAMENTO) — serviço de AVALIAÇÃO, na 8013. Não faz parte
  # do pipeline: está atrás do profile "mineru-v4", então `docker compose up -d` e o
  # unit systemd (que lista os serviços por nome) NUNCA o sobem. Produção segue na
  # 8012 com a 3.4.4 estável.
  #
  # Existe para responder com dados se a 4.0 corrige os erros de layout que o
  # relatório sumário↔títulos expôs (scripts/toc_heading_report.py) — em especial o
  # fragmento "EVEX?" virando `title` nível 2 no meio das referências.
  #
  #   docker compose --profile mineru-v4 build mineru-v4
  #   docker compose --profile mineru-v4 up -d mineru-v4
  #   docker compose --profile mineru-v4 down mineru-v4
  #
  # Como a de produção, exige --gpus all (count: all): com device único o vLLM falha
  # com "Device string must not be empty".
  mineru-v4:
    profiles: ["mineru-v4"]
    build:
      context: ./deploy/mineru-v4
      args:
        MINERU_VERSION: "4.0.0a5"
    image: evidencia_mineru:v4
    container_name: evidencia_mineru_v4
    # A 4.0 removeu o entry point `mineru-api` — virou subcomando de `mineru-kit`.
    # Sem `--preload-models` os modelos carregam sob demanda, que é o equivalente ao
    # `--enable-vlm-preload false` usado na 8012 (footprint baixo de VRAM).
    command: ["mineru-kit", "api-server", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      MINERU_MODEL_SOURCE: local
    ports:
      - "8013:8010"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8010/docs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    # "no": é serviço de avaliação — não deve voltar sozinho no boot.
    restart: "no"

  # ------------------------------------------------------------------------
  # Embedding (estágio 3): bge-m3 servido por vLLM. O backend NÃO carrega mais o
  # modelo — só fala HTTP com estes dois serviços (ver backend/services/embedder.py).
  #
  # São DOIS porque o vLLM implementa o bge-m3 como `BgeM3EmbeddingModel`, cujo
  # servidor HTTP fixa UMA pooling task por instância; a task combinada
  # (embed&token_classify) só existe na API offline. Então: um contêiner para o
  # denso (`embed`) e outro para o esparso (`token_classify`). O modelo é pequeno
  # (~2,3 GB fp16), então as duas réplicas cabem folgadas e respondem em paralelo.
  #
  # `--hf-overrides` é obrigatório: sem ele o vLLM carrega o bge-m3 como XLM-R puro
  # (só denso) e o `sparse_linear.pt` nunca é lido.
  #
  # Imagem própria (deploy/vllm-bge-m3/Dockerfile) com os pesos ASSADOS DENTRO e
  # HF_HUB_OFFLINE=1 — mesmo modelo dos serviços MinerU: a versão fica isolada na
  # imagem e o runtime não depende do cache do host nem da rede. As duas instâncias
  # compartilham a MESMA imagem; só o `--pooler-config.task` muda.
  #
  # `network_mode: host` → a porta vem do `--port` (não há mapeamento); os workers
  # no host falam direto com 127.0.0.1. `ipc: host` dá memória compartilhada cheia
  # ao vLLM. GPU via CDI (`nvidia.com/gpu=all`), equivalente ao `--gpus all`.
  vllm-bge-m3:
    profiles: ["gpu"]
    build:
      context: ./deploy/vllm-bge-m3
      args:
        VLLM_VERSION: "v0.26.0"
    image: evidencia_bge_m3:local
    container_name: vllm-bge-m3

    network_mode: host
    ipc: host

    devices:
      - nvidia.com/gpu=all

    command: >
      --model ${EMBED_MODEL:-BAAI/bge-m3}
      --served-model-name ${EMBED_API_MODEL:-BAAI/bge-m3}
      --hf-overrides '{"architectures":["BgeM3EmbeddingModel"]}'
      --pooler-config '{"task":"embed"}'
      --host 0.0.0.0
      --port ${EMBED_API_PORT:-8000}
      --gpu-memory-utilization ${EMBED_GPU_UTIL:-0.12}
      --max-model-len ${EMBED_MAX_LEN:-8192}

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:${EMBED_API_PORT:-8000}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  vllm-bge-m3-sparse:
    profiles: ["gpu"]
    build:
      context: ./deploy/vllm-bge-m3
      args:
        VLLM_VERSION: "v0.26.0"
    image: evidencia_bge_m3:local
    container_name: vllm-bge-m3-sparse

    network_mode: host
    ipc: host

    devices:
      - nvidia.com/gpu=all

    command: >
      --model ${EMBED_MODEL:-BAAI/bge-m3}
      --served-model-name ${EMBED_API_MODEL:-BAAI/bge-m3}
      --hf-overrides '{"architectures":["BgeM3EmbeddingModel"]}'
      --pooler-config '{"task":"token_classify"}'
      --host 0.0.0.0
      --port ${EMBED_API_SPARSE_PORT:-8001}
      --gpu-memory-utilization ${EMBED_GPU_UTIL:-0.12}
      --max-model-len ${EMBED_MAX_LEN:-8192}

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:${EMBED_API_SPARSE_PORT:-8001}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Embedding em CPU — alternativa aos DOIS serviços vLLM acima, para host sem
  # GPU nenhuma (`vllm/vllm-openai` é CUDA-only). Atrás do profile "cpu", então
  # `docker compose up -d` NÃO o sobe; é preciso pedir explicitamente:
  #
  #   docker compose --profile cpu build bge-m3-cpu
  #   docker compose --profile cpu up -d bge-m3-cpu
  #
  # UM contêiner serve as duas pooling tasks (o split em dois é limitação do
  # servidor HTTP do vLLM, não do modelo). Aponte as DUAS variáveis para ele:
  #
  #   EMBED_API_URL=http://127.0.0.1:8000
  #   EMBED_API_SPARSE_URL=http://127.0.0.1:8000
  #
  # Ordens de magnitude mais lento que a GPU: serve para busca (uma query por
  # vez), não para reindexar o acervo.
  bge-m3-cpu:
    profiles: ["cpu"]
    build:
      context: ./deploy/bge-m3-cpu
      args:
        EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
    image: evidencia_bge_m3_cpu:local
    container_name: bge-m3-cpu

    network_mode: host

    environment:
      EMBED_API_MODEL: ${EMBED_API_MODEL:-BAAI/bge-m3}
      EMBED_MAX_LEN: ${EMBED_MAX_LEN:-8192}
      # Threads intra-op do torch. Deixe abaixo do total de núcleos se o host
      # também roda os workers Celery.
      OMP_NUM_THREADS: ${EMBED_CPU_THREADS:-8}
      EMBED_CPU_MAX_BATCH_TOKENS: ${EMBED_CPU_MAX_BATCH_TOKENS:-16384}

    command: ["uvicorn", "app:app", "--host", "0.0.0.0",
              "--port", "${EMBED_API_PORT:-8000}", "--workers", "1"]

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:${EMBED_API_PORT:-8000}/health').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  redis_data:
  minio_data:
