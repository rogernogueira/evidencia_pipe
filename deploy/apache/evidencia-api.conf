# evidencia_pipe — publica a API FastAPI sob /api no vhost do DSpace.
#
# ATENÇÃO — ONDE ISTO É APLICADO:
# Este arquivo NÃO vai no host dev-rdapp (lá não existe /etc/apache2). O Apache
# que termina o TLS de devrdapp.ibict.br é uma MÁQUINA À PARTE (borda do IBICT,
# 200.130.0.2, cert wildcard *.ibict.br). É nela que este trecho entra, no mesmo
# <VirtualHost *:443> que hoje já faz:
#     /        -> dev-rdapp:4000  (dspace-angular, SSR)
#     /server  -> dev-rdapp:8080  (dspace REST)
# Nenhuma porta do dev-rdapp responde da internet — todo o tráfego passa por essa
# borda. Portanto a publicação da API depende de quem administra esse proxy.
#
# Por que conviver com o DSpace é seguro:
# Todas as rotas públicas da API já nascem com o prefixo /api (backend/api/routes/),
# então não há reescrita de caminho nem root_path a configurar. E /api não é usado
# por nenhuma rota do DSpace — hoje devolve só o shell do Angular (catch-all do SSR).
#
# Instalação (na máquina do proxy, como root):
#   1) cp evidencia-api.conf /etc/apache2/conf-available/evidencia-api.conf
#   2) incluir DENTRO do <VirtualHost *:443> de devrdapp.ibict.br, ANTES do
#      "ProxyPass / http://<dev-rdapp>:4000/" — o mod_proxy casa na ordem de
#      configuração, o primeiro que casar vence:
#         Include conf-available/evidencia-api.conf
#   3) apache2ctl configtest && systemctl reload apache2   (reload = graceful, o
#      DSpace não cai; se o configtest falhar, nada é aplicado)
#
# Rollback: comentar o Include e repetir o passo 3.

# Endereço do backend: MESMO host/IP que o vhost já usa para as portas 4000 e 8080,
# trocando a porta para 8020 (PORT=8020 no .env do dev-rdapp).
Define EVIDENCIA_API http://SUBSTITUA_PELO_HOST_DO_DSPACE:8020

# Repassa o Host original e informa ao FastAPI que a ponta é HTTPS.
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"

# timeout=120: as rotas de ingestão só enfileiram no Celery e respondem rápido;
# a folga cobre a busca semântica com o embedding em CPU.
# retry=0: se a API estiver fora do ar, o Apache tenta de novo no próximo request
# em vez de marcar o worker como morto por 60s.
ProxyPass        /api  ${EVIDENCIA_API}/api  timeout=120 retry=0
ProxyPassReverse /api  ${EVIDENCIA_API}/api

# NÃO publique /internal/* aqui: são rotas administrativas (download de artefatos
# e status de GPU) que assumem estar fora da internet — ver backend/api/routes/gpu.py.
# /health, /docs e o mount estático /output também ficam de fora de propósito;
# acesse-os pela rede interna, em <dev-rdapp>:8020.
