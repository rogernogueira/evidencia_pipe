# Parâmetros de kernel para o stack evidencia_pipe (Redis + Qdrant + workers).
# Instalar em /etc/sysctl.d/99-evidencia-pipe.conf e aplicar com `sysctl --system`.
# Valores escolhidos a partir do diagnóstico de rdapp (defaults do host hoje em
# comentário ao lado).

# Redis: com overcommit=0 o fork do BGSAVE pode falhar sob pressão de memória
# (host tem só 15 GiB). 1 = permite overcommit, recomendação oficial do Redis.
vm.overcommit_memory = 1          # host: 0

# Qdrant: usa arquivos mmap nos segmentos; o default (65530) limita o nº de
# mapeamentos e pode abortar com coleções maiores. 262144 é o recomendado.
vm.max_map_count = 262144         # host: default (não setado)

# Opcional: com 15 GiB de RAM, reduzir a tendência de swap mantém os modelos
# (bge-m3/MinerU) na RAM em vez de irem para o swap de 2 GiB. Ajuste conforme o
# comportamento observado.
vm.swappiness = 10                # host: 60
